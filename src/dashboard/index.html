<!-- HTML et CSS rédigé par IA -->

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Eirbone</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>Eirbone Dashboard</h1>

  <div id="tracker-bar">
    <span>Tracker :</span>
    <span id="tracker-state" class="pending">test...</span>
    <span id="tracker-addr"></span>
    <button id="retry-btn" onclick="checkTracker()" style="display:none">retry</button>
  </div>

  <h2>Recherche fichier</h2>
  <div class="row">
    <input id="s-name" placeholder="nom fichier">
    <button onclick="search()">chercher</button>
  </div>
  <div class="msg" id="s-msg"></div>
  <div id="search-result"></div>

  <h2>Telechargement direct</h2>
  <form class="row" onsubmit="launch(event)">
    <input id="d-ip" placeholder="ip" required>
    <input id="d-port" placeholder="port" required>
    <input id="d-key" placeholder="md5" required>
    <input id="d-fn" placeholder="nom optionnel">
    <button type="submit">lancer</button>
  </form>
  <div class="msg" id="d-msg"></div>

  <h2>Telechargements</h2>
  <div id="dls"><p class="empty">rien</p></div>

  <h2>Fichiers locaux</h2>
  <div id="loc"><p class="empty">chargement...</p></div>

  <div id="ts"></div>

  <script>
  const q = (id) => document.getElementById(id);

  // mini helper pour appeler le serveur en JSON
  async function post(url, body) {
    try {
      const opt = body
        ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
        : {};
      return await (await fetch(url, opt)).json();
    } catch {
      return null;
    }
  }

  async function checkTracker() {
    q('tracker-state').className = 'pending';
    q('tracker-state').textContent = 'test...';
    q('retry-btn').style.display = 'none';

    const d = await post('/tracker-status', null);
    if (d && d.ok) {
      q('tracker-state').className = 'ok';
      q('tracker-state').textContent = 'ok';
      q('tracker-addr').textContent = '(' + d.addr + ')';
      return;
    }

    q('tracker-state').className = 'err';
    q('tracker-state').textContent = 'ko';
    q('tracker-addr').textContent = d && d.error ? d.error : '';
    q('retry-btn').style.display = 'inline';
  }

  async function search() {
    const name = q('s-name').value.trim();
    if (!name) return;

    q('s-msg').textContent = 'recherche...';
    q('search-result').innerHTML = '';

    const d = await post('/search', { filename: name });
    if (!d || !d.found) {
      q('s-msg').textContent = (d && d.error) ? d.error : 'pas trouve';
      return;
    }

    q('s-msg').textContent = '';
    let peers = '<p class="empty">aucun peer</p>';
    if (d.peers.length) {
      peers = d.peers.map(p =>
        '<div class="peer-row">'
          + '<span>' + p.ip + ':' + p.port + '</span>'
          + '<button onclick="dlPeer(\'' + p.ip + '\',\'' + p.port + '\',\'' + d.key + '\',\'' + d.filename + '\')">telecharger</button>'
        + '</div>'
      ).join('');
    }

    q('search-result').innerHTML =
      '<div class="box">'
        + '<div><b>' + d.filename + '</b></div>'
        + '<div class="small">' + (d.size / 1024).toFixed(1) + ' Ko | piece ' + d.piece_size + ' | cle ' + d.key + '</div>'
        + peers
      + '</div>';
  }

  async function dlPeer(ip, port, key, filename) {
    const d = await post('/download', { ip, port, key, filename });
    if (d && !d.ok) {
      alert('erreur: ' + d.error);
    }
  }

  async function launch(e) {
    e.preventDefault();
    q('d-msg').textContent = 'connexion...';

    const d = await post('/download', {
      ip: q('d-ip').value.trim(),
      port: q('d-port').value.trim(),
      key: q('d-key').value.trim(),
      filename: q('d-fn').value.trim(),
    });

    if (d && d.ok) {
      q('d-msg').textContent = 'ok lance';
      e.target.reset();
    } else {
      q('d-msg').textContent = 'erreur ' + (d && d.error ? d.error : 'inconnue');
    }
  }

  function carte(nom, txt, pct, cls) {
    return '<div class="card">'
      + '<div><b>' + nom + '</b></div>'
      + '<div class="small">' + txt + '</div>'
      + '<div class="bar-wrap"><div class="bar ' + cls + '" style="width:' + pct + '%"></div></div>'
      + '</div>';
  }

  async function refresh() {
    const d = await post('/status', null);
    if (!d) return;

    q('dls').innerHTML = d.downloads.length
      ? d.downloads.map(x => {
          const cls = x.error ? 'err' : (x.complete ? 'ok' : '');
          const txt = x.error ? x.error : (x.done + ' / ' + x.total + ' pieces - ' + x.pct + '% - cle: ' + x.key);
          return carte(x.filename, txt, x.error ? 100 : x.pct, cls);
        }).join('')
      : '<p class="empty">aucun telechargement</p>';

    q('loc').innerHTML = d.local.length
      ? d.local.map(x => carte(x.filename, x.done + ' / ' + x.total + ' pieces - ' + x.pct + '% - cle: ' + x.key, x.pct, x.complete ? 'ok' : '')).join('')
      : '<p class="empty">aucun fichier local</p>';

    q('ts').textContent = 'maj: ' + new Date().toLocaleTimeString();
  }

  checkTracker();
  refresh();
  setInterval(checkTracker, 15000);
  setInterval(refresh, 2000);
  </script>
</body>
</html>
